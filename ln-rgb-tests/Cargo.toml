[package]
name = "ln-rgb-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.0"
authors = ["will-bitlightlabs <jayabb@bitlightlabs.com>"]
description = "Lightning Network RGB integration tests"

[dependencies]
# Lightning RGB wallet libraries (path reference)
lightning-rgb-wallet = { path = "../../lightning-rgb-lib/lightning-rgb-wallet" }
lightning-rgb-types = { path = "../../lightning-rgb-lib/lightning-rgb-types" }
lightning-rgb-core = { path = "../../lightning-rgb-lib/lightning-rgb-core" }
lightning-rgb-ln-types = { path = "../../lightning-rgb-lib/lightning-rgb-ln-types" }

# Bitcoin
bitcoin = "0.32"
bitcoin_hashes = "0.14.0"

# RGB foundation libraries (aligned with lightning-rgb-lib crates.io versions)
## bp-core
bp-core = "0.12.0"
## bp-electrum-client
bp-electrum = "0.12.0-rc.1"
## bp-esplora
bp-esplora = { version = "0.12.0-rc.3", features = ["blocking"], default-features = false }
## bp-std
bp-std = { version = "0.12.0-rc.3", features = ["signers"] }
descriptors = "0.12.0-rc.3"
bp-invoice = "0.12.0-rc.3"
psbt = "0.12.0-rc.3"
## bp-wallet - REMOVED (lightning-rgb-lib uses RGB Owner architecture instead)
# bp-wallet = { version = "0.12.0-rc.2", features = ["electrum", "esplora", "fs"] }
## rgb-runtime
rgb-runtime = { version = "0.12.0-rc.3", features = ["serde", "resolver-esplora"] }
rgb-psbt = { version = "0.12.0-rc.3", features = ["bp"] }
rgb-core = "0.12.0-rc.3"
rgb-persist-fs = "0.12.0-rc.3"
## rgb-std (using lightning-rgb-lib's private submodule)
rgb-std = { path = "../../lightning-rgb-lib/deps/rgb-std-private" }
## rgb-interfaces
rgb-interfaces = { version = "0.12.0-rc.3", features = ["serde"] }
## rust-amplify
amplify = "4.9.0"
## strict-encoding
strict_encoding = { version = "2.9.1", features = ["serde"] }
## strict-types
strict_types = "2.9.0"
## commit_verify
commit_verify = "0.12.0"
## sonic (using lightning-rgb-lib's private submodule)
hypersonic = { path = "../../lightning-rgb-lib/deps/sonic-private" }
sonic-persist-fs = { path = "../../lightning-rgb-lib/deps/sonic-private/persistence/fs" }
sonic-api = { path = "../../lightning-rgb-lib/deps/sonic-private/api" }
sonic-callreq = { path = "../../lightning-rgb-lib/deps/sonic-private/callreq", features = ["uri"] }
## single_use_seals
single_use_seals = { version = "0.12.0", features = ["strict_encoding"] }
## AluVM
aluvm = "0.12.0"
zk-aluvm = "0.12.0"
ultrasonic = "0.12.0"
## Other
baid64 = "0.4.2"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing utilities
rstest = "0.19.0"
rstest_reuse = "0.6.0"
serial_test = "3.2.0"
anyhow = "1.0"

# Utility libraries
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
indexmap = "2.7.0"
file-format = "0.25"
rand = "0.8"
time = "0.3"
once_cell = "1.19"
hex = "0.4"


[patch.crates-io]
# Align with lightning-rgb-lib patches (use same local submodules)
rgb-std = { path = "../../lightning-rgb-lib/deps/rgb-std-private" }
rgb-runtime = { path = "../../lightning-rgb-lib/deps/rgb-runtime-private", package = "rgb-runtime" }
rgb-psbt = { path = "../../lightning-rgb-lib/deps/rgb-runtime-private/psbt", package = "rgb-psbt", features = ["bp"] }
rgb-descriptors = { path = "../../lightning-rgb-lib/deps/rgb-runtime-private/descriptors", package = "rgb-descriptors" }
hypersonic = { path = "../../lightning-rgb-lib/deps/sonic-private" }
sonic-api = { path = "../../lightning-rgb-lib/deps/sonic-private/api" }
sonic-callreq = { path = "../../lightning-rgb-lib/deps/sonic-private/callreq" }
sonic-persist-fs = { path = "../../lightning-rgb-lib/deps/sonic-private/persistence/fs" }
bp-esplora = { git = "https://github.com/will-bitlightlabs/bp-esplora-client.git", branch = "fix/utxo-vout-type" }